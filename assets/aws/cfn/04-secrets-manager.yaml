AWSTemplateFormatVersion: "2010-09-09"
Description: >
  cipherops_tech AWS Security Lab 4 (Secrets Manager). A generated database
  secret plus an app role that can read only that secret. Cost: $0.40 per
  secret per month (prorated; new secrets start with a 30-day free trial).

Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cipherops-orders-app-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: cipherops/prod/orders/db
      Description: Orders database credentials (lab)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"orders"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  ReadOnlyThisSecret:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref AppRole
      PolicyName: read-orders-db-secret
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DbSecret

  SecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref DbSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyTheAppRoleReadsTheValue
            Effect: Deny
            Principal: "*"
            Action: secretsmanager:GetSecretValue
            Resource: "*"
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - !GetAtt AppRole.Arn
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/security-admin"

Outputs:
  SecretArn:
    Value: !Ref DbSecret
  AppRoleArn:
    Value: !GetAtt AppRole.Arn
