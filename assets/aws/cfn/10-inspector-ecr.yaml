AWSTemplateFormatVersion: "2010-09-09"
Description: >
  cipherops_tech AWS Security Lab 10 (Inspector). An ECR repository with a
  lifecycle policy, ready for Amazon Inspector enhanced scanning. Turn on
  Inspector separately (CLI step in the lab guide) because CloudFormation has
  no resource for enabling it. Cost: ECR storage for one small image (cents);
  Inspector has a 15-day free trial for new accounts.

Resources:
  LabRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cipherops/inspector-lab
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 5 newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt LabRepo.RepositoryUri
